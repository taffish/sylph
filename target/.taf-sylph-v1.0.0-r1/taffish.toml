[package]
name = "sylph"
kind = "tool"
version = "1.0.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/sylph"

[command]
name = "taf-sylph"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/sylph:1.0.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["metagenomics", "taxonomic-profiling", "microbiome", "ani", "sketching"]
keywords = ["syl2db", "sylph", "metagenomics", "taxonomic profiling", "containment ANI", "average nucleotide identity", "MinHash", "k-mer", "syldb", "sylsp", "GTDB"]
description = "Sylph 1.0.0 runtime for ultrafast species-level metagenomic profiling and containment ANI querying."

[upstream]
name = "sylph"
type = "github"
repo = "bluenote-1577/sylph"
homepage = "https://sylph-docs.github.io/"
manual = "https://sylph-docs.github.io/"
release_url = "https://github.com/bluenote-1577/sylph/releases/tag/v1.0.0"
downloads = "https://github.com/bluenote-1577/sylph/archive/refs/tags/v1.0.0.tar.gz"
version = "1.0.0"
commit = "f2eafcdc1c4d9ab984a4fbee160a772686f02bd9"
license = "MIT OR Apache-2.0"
citation = "Shaw and Yu 2025, Rapid species-level metagenome profiling and containment estimation with sylph, Nature Biotechnology 43:1348-1359"
doi = "10.1038/s41587-024-02412-y"
pmid = "39379646"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["sylph", "sylph-db", "python3", "curl", "sh", "awk", "gzip", "grep", "head", "tail", "mkdir", "rm", "mv", "mktemp", "cmp", "cut", "ldd"]
test = ["grep -Fx 'source_sha256=dd4ba47906be7f3502b6bec88fa212ba5340b1eefced0192052ef0da82ca3a2d' /opt/sylph/share/doc/sylph/source.txt >/dev/null && grep -Fx 'upstream_commit=f2eafcdc1c4d9ab984a4fbee160a772686f02bd9' /opt/sylph/share/doc/sylph/source.txt >/dev/null", "/opt/sylph/share/testdata/sylph-smoke.sh interfaces", "/opt/sylph/share/testdata/sylph-smoke.sh buildtime", "/opt/sylph/share/testdata/sylph-smoke.sh profile", "/opt/sylph/share/testdata/sylph-smoke.sh paired", "/opt/sylph/share/testdata/sylph-smoke.sh two-stage", "/opt/sylph/share/testdata/sylph-smoke.sh parallel", "/opt/sylph/share/testdata/sylph-smoke.sh resources"]
