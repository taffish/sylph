[package]
name = "sylph"
kind = "tool"
version = "0.9.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/sylph"

[command]
name = "taf-sylph"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/sylph:0.9.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["metagenomics", "taxonomic-profiling", "microbiome", "ani", "sketching"]
keywords = ["sylph", "metagenomics", "taxonomic profiling", "containment ANI", "average nucleotide identity", "MinHash", "k-mer", "syldb", "sylsp", "GTDB"]
description = "Sylph 0.9.0 runtime for ultrafast species-level metagenomic profiling and containment ANI querying."

[upstream]
name = "sylph"
type = "github"
repo = "bluenote-1577/sylph"
homepage = "https://sylph-docs.github.io/"
manual = "https://sylph-docs.github.io/"
release_url = "https://github.com/bluenote-1577/sylph/releases/tag/v0.9.0"
downloads = "https://github.com/bluenote-1577/sylph/archive/refs/tags/v0.9.0.tar.gz"
version = "0.9.0"
license = "MIT OR Apache-2.0"
citation = "Shaw and Yu 2025, Rapid species-level metagenome profiling and containment estimation with sylph, Nature Biotechnology 43:1348-1359"
doi = "10.1038/s41587-024-02412-y"
pmid = "39379646"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["sylph", "sh", "awk", "gzip", "grep", "head", "mkdir", "rm", "ldd"]
test = ["grep -F 'source_sha256=c11fbe5720500c43e7102a359dd9ec59b09b93a15a8ce6f6a3bb917430c3059e' /opt/sylph/share/doc/sylph/source.txt >/dev/null && grep -F 'upstream_commit=9e0e48c389fe0998b0c1c3fa0321eb93b8b36394' /opt/sylph/share/doc/sylph/source.txt >/dev/null", "/opt/sylph/share/testdata/sylph-smoke.sh interfaces /tmp/taf-sylph-index-interfaces-$$", "/opt/sylph/share/testdata/sylph-smoke.sh buildtime /tmp/taf-sylph-index-buildtime-$$", "/opt/sylph/share/testdata/sylph-smoke.sh profile /tmp/taf-sylph-index-profile-$$", "/opt/sylph/share/testdata/sylph-smoke.sh paired /tmp/taf-sylph-index-paired-$$"]
